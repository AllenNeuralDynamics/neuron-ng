[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-ng"
version = "0.1.0"
description = "Neuroglancer layers and views for neuron reconstructions"
readme = "README.md"
authors = [{ name = "Cameron Arshadi", email = "cameron.arshadi@alleninstitute.org" }]
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy"]

[project.optional-dependencies]
# Writing precomputed annotations; the neuroglancer package needs Python >= 3.10.
annotations = ["neuroglancer>=2.40; python_version >= '3.10'"]
s3 = ["boto3"]
test = ["pytest", "neuroglancer>=2.40; python_version >= '3.10'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
